name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # engines: ^22.19.0 || >=24.0.0
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # lib/ is committed on purpose (it is what `dsh plugin add <git-url>`
      # installs), so a source change that was never rebuilt would ship a stale
      # bundle to everyone who clones this repository.
      - name: lib/ is in sync with src/
        run: git diff --exit-code -- lib
